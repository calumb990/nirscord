[project]
name = "nirscord"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.0.2",
    "h5py>=3.16.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "protobuf>=7.35.1",
    "pylsl>=1.18.2",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
    "websockets>=16.1.1",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8.0,<0.9.0"]

[project.scripts]
nirscord = "nirscord.main:main"